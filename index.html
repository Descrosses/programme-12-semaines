<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0e11" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="MAJK — tes programmes d’entraînement, ta progression et tes performances, hors ligne."
    />

    <!-- iOS : sans ces deux lignes, l'icône de l'écran d'accueil ouvre Safari
         avec sa barre d'adresse au lieu de lancer l'appli en plein écran. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MAJK" />
    <!--
      Les icônes portent des noms NEUFS plutôt que de remplacer les anciens
      fichiers. iOS garde l'image d'un raccourci au moment où on l'ajoute, et
      un navigateur peut servir longtemps un PNG déjà vu : réécrire
      `apple-touch-icon.png` aurait laissé l'ancienne image à l'écran sans
      moyen de savoir quand elle partirait. Un chemin qui n'a jamais existé ne
      peut pas être en cache.

      C'est la deuxième fois que la règle sert : les fichiers `majk-*`
      remplacent les `icone-*`, qui restent en place le temps que les anciens
      raccourcis disparaissent.
    -->
    <link rel="apple-touch-icon" href="icons/majk-apple-touch.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/majk-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/majk-192.png" />

    <!--
      Aperçu de lien (Open Graph).

      Sans ces lignes, un message contenant le lien n'avait AUCUNE image à
      montrer : le robot de Messenger ou de WhatsApp se rabattait sur ce qu'il
      trouvait — en l'occurrence l'ancienne icône haltère, qu'il gardait en
      cache. L'aperçu d'un lien est pourtant la première chose que voit
      quelqu'un à qui on envoie l'appli.

      L'URL doit être ABSOLUE : un robot ne résout pas les chemins relatifs. Le
      domaine est donc écrit en dur ici, alors que tout le reste du projet
      passe par `base`. Si le dépôt change de nom ou d'hébergement, ces quatre
      adresses sont à corriger à la main.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="MAJK" />
    <meta property="og:url" content="https://descrosses.github.io/programme-12-semaines/" />
    <meta property="og:title" content="MAJK — programmes, progression, performance" />
    <meta
      property="og:description"
      content="Tes programmes, tes séances et ta progression. Hors ligne, sur ton téléphone."
    />
    <meta
      property="og:image"
      content="https://descrosses.github.io/programme-12-semaines/partage-majk-1200x630.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Le logo MAJK : un as et un valet de cœur, sur fond graphite."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MAJK — programmes, progression, performance" />
    <meta
      name="twitter:description"
      content="Tes programmes, tes séances et ta progression. Hors ligne, sur ton téléphone."
    />
    <meta
      name="twitter:image"
      content="https://descrosses.github.io/programme-12-semaines/partage-majk-1200x630.jpg"
    />

    <title>MAJK</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
