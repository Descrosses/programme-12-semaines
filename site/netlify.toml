# Configuration Netlify — rien à modifier.
# `base` indique que le site vitrine est dans le dossier `site/` du dépôt.
[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Les pages de remerciement ne doivent jamais apparaître dans Google.
[[headers]]
  for = "/merci/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Mise en cache longue des fichiers générés (noms uniques à chaque build).
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
