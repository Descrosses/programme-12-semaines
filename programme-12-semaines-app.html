<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Programme 12 semaines — Guillaume</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a2028; --panel:#232b35; --panel2:#2c3641; --line:#3a4653;
    --ink:#eef1f4; --ink2:#a9b4c0; --ink3:#7b8895;
    --acc:#f2b33d; --acc-ink:#1a2028;
    --green:#4fc37a; --orange:#f2a33d; --red:#e5533d;
    --accum:#5aa7e0; --deload:#8fa3b5; --max:#e5533d; --power:#f2b33d; --taper:#4fc37a;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,sans-serif;font-size:16px;line-height:1.4}
  body{padding-bottom:110px}
  button{font-family:inherit;border:0;cursor:pointer}
  .cond{font-family:"Barlow Condensed","Barlow",system-ui,sans-serif}

  header{padding:18px 16px 10px}
  header h1{margin:0;font-size:30px;line-height:1;font-weight:700}
  header p{margin:6px 0 0;color:var(--ink2);font-size:14px}

  .weeks{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 10px;scrollbar-width:none}
  .weeks::-webkit-scrollbar{display:none}
  .wk{flex:0 0 auto;min-width:54px;height:54px;border-radius:12px;background:var(--panel);color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid transparent}
  .wk b{font-size:22px;line-height:1;color:var(--ink)}
  .wk small{font-size:11px;margin-top:3px}
  .wk[data-b="accum"]{border-color:var(--accum)}
  .wk[data-b="deload"]{border-color:var(--deload)}
  .wk[data-b="max"]{border-color:var(--max)}
  .wk[data-b="power"]{border-color:var(--power)}
  .wk[data-b="taper"],.wk[data-b="test"]{border-color:var(--taper)}
  .wk.on{background:var(--ink);color:var(--ink3)}
  .wk.on b{color:var(--bg)}

  .days{display:flex;gap:6px;padding:4px 16px 12px}
  .day{flex:1;height:44px;border-radius:10px;background:var(--panel);color:var(--ink2);font-size:16px;font-weight:600}
  .day.on{background:var(--acc);color:var(--acc-ink)}
  .day.done{box-shadow:inset 0 0 0 2px var(--green)}

  .sess{margin:0 16px 12px;padding:16px;border-radius:var(--radius);background:var(--panel)}
  .sess h2{margin:0;font-size:28px;line-height:1.05;font-weight:700}
  .sess .meta{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink2);font-size:14px}
  .sess .meta span b{color:var(--ink);font-weight:600}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:13px;font-weight:600;color:var(--bg)}
  .sess .note{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--panel2);font-size:14px;color:var(--ink2)}
  .sess .note b{color:var(--ink)}

  .ready{margin:0 16px 12px;padding:14px 16px;border-radius:var(--radius);background:var(--panel);border-left:6px solid var(--ink3)}
  .ready.g{border-left-color:var(--green)} .ready.o{border-left-color:var(--orange)} .ready.r{border-left-color:var(--red)}
  .ready h3{margin:0 0 4px;font-size:20px}
  .ready p{margin:0;color:var(--ink2);font-size:14px}
  .ready .row{display:flex;gap:8px;margin-top:10px;align-items:center}
  .ready input{flex:1;min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:20px;padding:0 12px;font-family:"Barlow Condensed";font-weight:700}
  .ready button{height:44px;padding:0 14px;border-radius:10px;background:var(--panel2);color:var(--ink);font-weight:600}
  .ready .verdict{margin-top:10px;font-size:15px}
  .ready .verdict b{font-size:18px}

  .list{padding:0 16px}
  .ex{background:var(--panel);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
  .ex.done{opacity:.5}
  .ex .top{display:flex;align-items:stretch}
  .ex .chk{flex:0 0 52px;display:flex;align-items:center;justify-content:center;background:var(--panel2)}
  .ex .chk i{width:26px;height:26px;border-radius:8px;border:2px solid var(--ink3);display:block}
  .ex.done .chk i{background:var(--green);border-color:var(--green)}
  .ex .body{flex:1;padding:12px 12px 10px;min-width:0}
  .ex .name{font-size:17px;font-weight:600;line-height:1.2}
  .ex .load{font-size:32px;line-height:1;margin-top:4px;font-weight:700;letter-spacing:.2px}
  .ex .load small{font-size:16px;color:var(--ink2);font-weight:500;margin-left:6px}
  .ex .sub{margin-top:5px;color:var(--ink2);font-size:14px}
  .ex .rest{flex:0 0 76px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel2);color:var(--ink);gap:2px}
  .ex .rest b{font-size:22px;line-height:1;font-weight:700}
  .ex .rest small{font-size:11px;color:var(--ink2)}
  .ex .rest.none{color:var(--ink3)}
  .ex .cue{display:none;padding:10px 14px 12px;border-top:1px solid var(--line);font-size:14px;color:var(--ink2)}
  .ex .cue p{margin:0 0 6px}
  .ex .cue p:last-child{margin:0}
  .ex .cue b{color:var(--ink);font-weight:600}
  .ex.open .cue{display:block}
  .ex .hint{font-size:12px;color:var(--ink3);margin-top:6px}

  .group{padding:14px 16px 6px;color:var(--ink2);font-size:14px}
  .group b{color:var(--ink);font-size:18px;display:block;font-family:"Barlow Condensed";font-weight:700}

  .timer{position:fixed;left:0;right:0;bottom:0;background:var(--acc);color:var(--acc-ink);display:none;align-items:center;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.4)}
  .timer.on{display:flex}
  .timer .t{font-size:44px;line-height:1;font-weight:700;min-width:120px}
  .timer .n{flex:1;font-size:14px;font-weight:600;line-height:1.2}
  .timer button{height:44px;padding:0 14px;border-radius:10px;background:var(--acc-ink);color:var(--acc);font-weight:600;font-size:15px}
  .timer.over{background:var(--green);color:var(--acc-ink)}

  .foot{margin:6px 16px 0;color:var(--ink3);font-size:13px}
  .foot button{background:none;color:var(--ink2);text-decoration:underline;padding:0;font-size:13px}
  @media (min-width:640px){body{max-width:560px;margin:0 auto}}
  @media (prefers-reduced-motion:no-preference){.ex .cue{animation:none}}
</style>
</head>
<body>

<header>
  <h1 class="cond">Programme 12 semaines</h1>
  <p id="hdr"></p>
</header>

<div class="weeks" id="weeks"></div>
<div class="days" id="days"></div>

<div id="content"></div>

<div class="foot" id="foot"></div>

<div class="timer" id="timer">
  <div class="t cond" id="tval">0:00</div>
  <div class="n" id="tname"></div>
  <button id="tstop">Stop</button>
</div>

<script>
/* ---------- STORAGE (persist if available, else memory) ---------- */
const mem={};
const store={
  async get(k){ try{ if(window.storage){const r=await window.storage.get(k,false); return r?JSON.parse(r.value):null;} }catch(e){} return mem[k]??null; },
  async set(k,v){ mem[k]=v; try{ if(window.storage) await window.storage.set(k,JSON.stringify(v),false);}catch(e){} }
};

/* ---------- PROGRAM DATA ---------- */
const BLOCK=w=>w===0?'test':[4,8].includes(w)?'deload':w<=3?'accum':w<=7?'max':w<=11?'power':'taper';
const BLOCKNAME={test:'Tests initiaux',accum:'Accumulation',deload:'Deload',max:'Force max',power:'Puissance',taper:'Taper + tests'};
const BLOCKCOLOR={test:'var(--taper)',accum:'var(--accum)',deload:'var(--deload)',max:'var(--max)',power:'var(--power)',taper:'var(--taper)'};

// [sets, reps, kg, rpe] index = week-1
const T={
 squat:[[5,5,100,7],[5,5,105,7.5],[5,4,110,8],[3,3,90,5],[5,3,115,8],[4,3,120,8.5],[4,2,125,9],[3,3,97.5,5],[4,2,117.5,8],[4,2,120,8],[4,'1-2',125,8.5],[3,2,97.5,'5-6']],
 bench:[[5,5,87.5,7],[5,5,90,7.5],[5,4,95,8],[3,3,80,5],[5,3,100,8],[4,3,102.5,8.5],[4,2,107.5,9],[3,3,85,5],[4,2,100,8],[4,2,102.5,8],[4,'1-2',107.5,8.5],[3,2,85,'5-6']],
 dl:[[4,5,97.5,7],[4,5,102.5,7.5],[4,4,107.5,8],[3,3,85,5],[4,3,110,8],[3,3,115,8.5],[3,2,120,9],[3,3,90,5],[3,2,112.5,8],[3,2,117.5,8],[3,'1-2',120,8.5],null],
 pull:[[4,5,17.5,7],[4,5,20,7.5],[4,4,22.5,8],[3,3,10,5],[4,3,27.5,8],[4,3,30,8.5],[4,2,32.5,9],[3,2,15,5],[3,3,27.5,8],[3,3,30,8],[3,2,32.5,8.5],[3,3,'léger',5]],
 pp:[[5,3,50],[5,3,52.5],[6,2,55],[3,3,45],[6,2,55],[6,2,57.5],[6,2,60],[3,2,45],[6,2,57.5],[6,2,60],[6,2,62.5],[3,2,50]],
 fs:[[3,6,75],[3,6,77.5],[3,6,80],[2,5,65],[4,5,82.5],[4,4,87.5],[4,4,90],[2,4,70],[3,3,90],[3,3,92.5],[3,3,95],null],
 ss:[[6,2,77.5],[6,2,77.5],[6,2,80],[4,2,70],[6,2,85],[6,2,85],[6,2,85],[4,2,70],[8,2,85],[8,2,85],[8,2,87.5],[2,2,70]],
 rdl:[[3,8,80],[3,8,85],[3,8,90],[2,6,70],[3,6,90],[4,5,92.5],[4,5,95],[2,5,72.5],[3,5,90],[3,5,92.5],[3,5,95],null],
};
const L=(a,unit='kg')=>a==null?'':`${a[0]} × ${a[1]} × ${typeof a[2]==='number'?a[2]+' '+unit:a[2]}`;
const P=(a)=>a==null?'':`${a[0]} × ${a[1]} × +${typeof a[2]==='number'?a[2]+' kg':a[2]}`;
const RP=a=>a&&a[3]!=null?`RPE ${a[3]}`:'';

const ex=(name,load,sub,rest,cue,alt)=>({name,load,sub,rest,cue,alt});
const grp=(title,sub)=>({group:title,sub});

function bigRest(b,kind){ // seconds
  if(kind==='sqdl') return b==='max'||b==='power'?240:b==='deload'?180:210;
  if(kind==='bench') return b==='max'?210:b==='power'?90:b==='deload'?150:180;
  if(kind==='pull') return b==='max'||b==='power'?180:150;
}

/* ---------- SESSION BUILDERS ---------- */
function lundi(w){
  const b=BLOCK(w), i=w-1, dl=b==='deload';
  if(b==='taper') return {title:'Lower — activation',dur:'35 min',charge:'LÉGER',ready:true,note:'Semaine de taper. Tu sors frais, pas fatigué.',items:[
    ex('Box Jump','3 × 2','maximal, reset complet',120,'Réception silencieuse.'),
    ex('Back Squat',L(T.squat[11]),RP(T.squat[11]),180,'Vitesse de barre, rien de plus.'),
    ex('Bulgarian Split Squat','2 × 5 / jambe','léger',60,''),
    ex('Ab Wheel','2 × 6','',60,'')]};
  const items=[];
  if(b!=='power'){
    items.push(ex('Pogo Jumps',dl?'2 × 10':'3 × 10','contacts courts',45,'Chevilles rigides, peu de flexion du genou. Arrêt si les rebonds deviennent lourds.'));
    items.push(ex('Box Jump',dl?'2 × 3':b==='max'?'4 × 2':'4 × 3','maximal, reset 5-10 s entre reps',b==='max'?120:90,'Hauteur où tu atterris souple sans rentrer les genoux (60-75 cm). Arrêt si la réception devient bruyante.','Sans box : Vertical Jump sur cible murale.'));
  }
  const sq=T.squat[i];
  items.push(ex('Back Squat',L(sq),RP(sq)+(b==='power'?' — contraste':''),bigRest(b,'sqdl'),
    b==='accum'?'Tempo 3-0-X : descente 3 s, remontée avec intention d\'accélération maximale.':
    b==='power'?'<b>Contraste :</b> série de squat → repos 2 min → Box Jump × 2 maximaux → repos 2 min → squat suivant. Cycle ≈ 4 min. Ce n\'est pas un superset.':
    dl?'Charge légère, vitesse de barre, RPE 5 max.':'Descente contrôlée ~2 s, remontée intention maximale. Repos 4 min entiers.'));
  items.push(ex('Bulgarian Split Squat',dl?'2 × 6 / jambe':b==='accum'?'3 × 8 / jambe':b==='max'?'4 × 5 / jambe':'3 × 5 / jambe',b==='accum'?'haltères 2 × 18 kg — RPE 7-8':b==='max'?'RPE 8 — plus lourd que bloc 1':dl?'−20 %':'RPE 7,5',b==='accum'?90:120,'Tempo 3-1-X-0. <b>Progression :</b> reps propres à RPE ≤ 7,5 → +2 kg par haltère.'));
  const r=T.rdl[i];
  items.push(ex('Romanian Deadlift',L(r),b==='power'?'RPE 7 — on ne cherche plus de dommages':b==='max'?'RPE 7,5-8':dl?'RPE 5':'RPE 7',150,'Tempo 3-1-X-1. Descends jusqu\'à l\'étirement maximal des ischios sans perdre la neutralité lombaire. Barre collée aux cuisses.'));
  items.push(ex('Ab Wheel',dl?'2 × 6':b==='max'?'4 × 6-8':'3 × 8',b==='max'?'amplitude max ou lesté':'anti-extension',60,'Bassin en rétroversion. Augmente l\'amplitude avant les reps.','Rollout avec barre chargée de deux disques.'));
  return {title:'Lower Strength — squat',dur:'65-70 min',charge:'DUR',ready:true,warm:'lower',items};
}

function mercredi(w){
  const b=BLOCK(w), i=w-1, dl=b==='deload';
  if(b==='taper') return {title:'Test Deadlift 1RM',dur:'45 min',charge:'TEST',ready:true,note:'Rien d\'autre aujourd\'hui. Échauffement complet puis les singles.',items:[
    ex('Échauffement deadlift','60×5 / 80×3 / 100×2 / 115×1 / 130×1','repos 2-3 min',180,''),
    ex('Deadlift 1RM','137,5 → 142,5 → 147,5 → 152,5','selon vitesse de barre — repos 4-5 min',300,'Chaque tentative propre. Si la barre ralentit franchement, c\'est le max. Note le chiffre.')]};
  const items=[];
  items.push(ex('Plyo Push-Up',dl?'2 × 4':b==='max'?'4 × 3':b==='power'?'':'4 × 4',b==='power'?'dans le contraste bench':'mains décollent, réception souple',90,'Arrêt si les mains décollent moins.','Mains sur un step si trop dur.'));
  if(b==='power') items.pop();
  const be=T.bench[i];
  items.push(ex('Bench Press',L(be),RP(be)+(b==='power'?' — contraste':''),bigRest(b,'bench'),
    b==='power'?'<b>Contraste :</b> série de bench → repos 90 s → Plyo Push-Up × 3 → repos 2 min → bench suivant.':'Tempo 2-1-X-0 : pause réelle 1 s sur le torse, poussée explosive.'));
  const pu=T.pull[i];
  items.push(ex('Tractions lestées',P(pu),RP(pu)+(b==='power'?' — intention explosive':''),bigRest(b,'pull'),'Dead hang complet, zéro kipping, poitrine vers la barre. Descente contrôlée 2 s.'));
  items.push(ex('Landmine Press half-kneeling',dl?'2 × 8 / côté':b==='accum'?'3 × 8 / côté':b==='max'?'3 × 6 / côté':'4 × 5 / côté',b==='accum'?'barre + 20 kg — RPE 7':b==='max'?'+10 % — RPE 8':b==='power'?'explosif — RPE 6':'−20 %',b==='max'?90:75,'Transfert jambes → tronc → bras.','Barre calée dans un coin avec une serviette. Sinon développé haltère unilatéral à genou, 22 kg.'));
  items.push(ex('Chest-supported DB Row',dl?'2 × 8':b==='accum'?'3 × 8':b==='max'?'4 × 6':'3 × 6',b==='accum'?'30 kg — RPE 8':b==='max'?'RPE 8':'RPE 7,5',90,'Pause 1 s en contraction.'));
  items.push(ex('Face Pull + Rotation externe','2 × 15 + 2 × 12 / côté','léger — non négociable',45,'Robustesse coiffe et scapula.'));
  items.push(ex('Pallof Press Step-Out',dl?'2 × 5 / côté':b==='power'?'3 × 5 / côté':'3 × 6 / côté',b==='max'?'+ overhead reach':'anti-rotation dynamique',50,'Step-out → verrouillage 2 s → retour.'));
  return {title:'Upper Strength — bench + tractions',dur:'65 min',charge:'DUR',ready:false,warm:'upper',items};
}

function vendredi(w){
  const b=BLOCK(w), i=w-1, dl=b==='deload';
  if(b==='taper') return {title:'Tests athlétiques',dur:'45 min max',charge:'TEST',ready:false,note:'Même lieu, mêmes chaussures que le test initial.',items:[
    ex('Broad Jump','3 essais','repos 3 min — garde le meilleur',180,'Orteils au départ → talon le plus arrière à l\'arrivée.'),
    ex('Vertical Jump','5 essais','repos 90 s',90,'Marque murale main tendue vs sommet du saut.'),
    ex('Sprint 10 m et 20 m','3-4 essais','repos 3-4 min — chrono vidéo',210,'Jamais sur tapis. Si pas d\'espace : saute ce test.'),
    ex('Tractions strictes max','1 série','poitrine à la barre',0,''),
    ex('Hanging Leg Raise max','1 série','strict',0,'')]};
  const items=[];
  items.push(ex('Broad Jump',dl?'3 × 2':'5 × 2','maximal — mesure les distances',120,'Les 3 sauts du readiness servent d\'échauffement. Reset complet entre chaque saut.'));
  if(b==='power') items.push(ex('Pogo Jumps','3 × 10','contacts courts',45,''));
  items.push(ex('Lateral Bound',dl?'2 × 3 / côté':b==='power'?'4 × 2 / côté':'3 × 3 / côté','tiens la réception 2 s',b==='power'?90:75,'Puissance plan frontal, stabilité genou/cheville.'));
  const pp=T.pp[i];
  items.push(ex('Push Press',L(pp),b==='accum'?'RPE ≤ 7':'RPE 6-7 — vitesse prioritaire',b==='accum'?120:150,'Dip court (10-15 cm), drive explosif. La barre doit voler. Si la dernière rep devient un strict press : trop lourd, tu arrêtes. <b>Progression :</b> +2,5 kg quand toutes les reps sont rapides.'));
  const ss=T.ss[i];
  items.push(ex('Speed Squat',L(ss),b==='accum'?'55 % — vitesse maximale':b==='max'?'60 %':b==='power'?'60 % — 8 séries':'léger',b==='accum'?60:b==='max'?75:90,'Descente contrôlée, remontée la plus rapide possible. Arrêt dès que la vitesse baisse visiblement.'));
  items.push(ex('Jump Squat haltères',dl?'2 × 4':b==='accum'?'4 × 4':'5 × 3','2 × 6-8 kg — vitesse de projection',b==='power'?120:90,'Ne mets pas 40 kg. Objectif = vitesse.'));
  if(b!=='power') items.push(ex('Explosive Cable Row',dl?'2 × 5':'3 × 5','RPE 6',75,'Tirer vite, retour contrôlé.'));
  items.push(ex('Farmer Carry',dl?'2 × 25 m':b==='accum'?'4 × 25 m':b==='max'?'4 × 20 m lourd':'3 × 20 m','haltères 2 × 34 kg au départ',90,'Buste haut, marche agressive. <b>Progression :</b> +2 kg quand la distance est tenue sans ralentir.'));
  if(b!=='power') items.push(ex('Dead Bug câble',dl?'2 × 6 / côté':'3 × 6 / côté','anti-extension',45,''));
  return {title:'Total Body Power',dur:'60 min',charge:'RAPIDE',ready:true,warm:'lower',note:'Tu dois sortir en te disant « j\'aurais pu en faire plus ».',items};
}

function samedi(w){
  const b=BLOCK(w), i=w-1, dl=b==='deload';
  if(b==='taper') return {title:'Test Squat 1RM + Farmer',dur:'60 min',charge:'TEST',ready:true,items:[
    ex('Échauffement squat','60×5 / 80×3 / 100×2 / 115×1 / 130×1','repos 2-3 min',180,''),
    ex('Back Squat 1RM','142,5 → 147,5 → 152,5 → 155','selon vitesse — repos 4-5 min',300,'Un squat propre à 152,5 vaut plus qu\'un grinder hideux à 160.'),
    ex('Farmer Carry test','2 × 40 kg','distance max sans poser',0,'Arrêt : haltère posé, grip perdu ou posture dégradée.')]};
  if(w===8) return {title:'Combine intermédiaire',dur:'60 min',charge:'TEST',ready:false,note:'Pas de 1RM cette semaine. Tests athlétiques seulement.',items:[
    ex('Poids','moyenne de 3 matins','',0,''),
    ex('Broad Jump','3 essais','repos 3 min',180,''),
    ex('Vertical Jump','5 essais','repos 90 s',90,''),
    ex('Sprint 10 / 20 m','3 essais','si surface adaptée',210,''),
    ex('Tractions strictes max','1 série','',0,''),
    ex('Farmer Carry','2 × 40 kg','distance max',0,''),
    ex('Deadlift technique',L(T.dl[7]),'RPE 5 — vitesse',180,'')]};
  const items=[];
  if(b!=='power') items.push(ex('Broad Jump',dl?'2 × 2':'3 × 2','potentiation',90,'Après le readiness.'));
  const d=T.dl[i];
  items.push(ex('Deadlift conventionnel',L(d),RP(d)+(b==='power'?' — contraste':''),bigRest(b,'sqdl'),
    (b==='power'?'<b>Contraste :</b> série de deadlift → repos 2 min → Broad Jump × 2 → repos 2 min → deadlift suivant. Toutes les reps propres.':'Chaque rep part du sol, pas de touch-and-go. Hanches hautes, tension avant décollage, barre contre les tibias, montée avec intention de vitesse maximale.')+(w<=2?' <b>Ton 130 est probablement sous-estimé :</b> si ça sort à RPE ≤ 6, +5 kg la semaine prochaine.':'')));
  const f=T.fs[i];
  items.push(ex('Front Squat',L(f),b==='accum'?'RPE 7 — +2,5 kg / semaine si RPE conforme':b==='max'?'RPE 7,5-8':b==='power'?'RPE 7':'léger',b==='max'?150:120,''));
  items.push(ex('Hip Thrust',dl?'2 × 6':b==='accum'?'4 × 8 × 100 kg':b==='max'?'4 × 6':'4 × 5 explosif',b==='accum'?'RPE 8':b==='max'?'RPE 8':'RPE 7-8',b==='accum'?90:120,'2 s de contraction en haut, menton rentré. <b>Progression :</b> +10 kg quand RPE ≤ 7.','Machine hip thrust si présente, sinon banc + barre avec pad.'));
  items.push(ex('Nordic Curl',dl?'—':b==='accum'?'3 × 5':b==='max'?'3 × 4-5':'2 × 4',dl?'supprimé en deload':'descente 4-5 s',120,'Pieds sous le rouleau d\'une machine, assistance des mains au sol.','Leg Curl 3 × 8, tempo 4-0-1-0.'));
  if(dl) items.pop();
  items.push(ex('Single-Leg RDL haltère',dl?'2 × 6 / côté':'3 × 8 / côté','20 kg — lent, hanche carrée',60,''));
  items.push(ex('Copenhagen Plank dynamique',dl?'2 × 6 / côté':b==='accum'?'3 × 8 / côté':b==='max'?'3 × 6 / côté':'3 × 5 / côté','adducteurs + anti-inclinaison',60,'Pied supérieur sur banc, monte et descends le bassin.'));
  items.push(ex('Suitcase Carry',dl?'2 × 20 m / côté':b==='accum'?'3 × 30 m / côté':b==='max'?'4 × 20 m / côté':'3 × 20 m / côté','32 kg — zéro inclinaison',60,'Regarde droit devant.'));
  return {title:'Posterior Chain — deadlift',dur:'90 min',charge:'DUR',ready:true,warm:'lower',items};
}

function dimanche(w){
  const b=BLOCK(w), i=w-1, dl=b==='deload';
  if(b==='taper') return {title:'Test Bench + tractions + tronc',dur:'75 min',charge:'TEST',ready:false,items:[
    ex('Échauffement bench','60×5 / 80×3 / 95×1 / 107,5×1','repos 2-3 min',180,''),
    ex('Bench 1RM','117,5 → 122,5 → 125 → 127,5','repos 4-5 min',300,''),
    ex('Repos','10 min','',600,''),
    ex('Tractions lestées 1RM','+20×3 / +30×1 / +36×1 / +40 / +42,5 / +45','repos 4 min',240,'Dead hang, menton franchement au-dessus.'),
    ex('Ab Wheel max','1 série','arrêt à la perte de rétroversion',0,'')]};
  if(w===8) return {title:'Combine intermédiaire (suite)',dur:'60 min',charge:'TEST',ready:false,items:[
    ex('Ab Wheel max','1 série','',0,''),
    ex('Hanging Leg Raise max','1 série','',0,''),
    ex('Bench technique',L(T.bench[7]),'RPE 5',150,''),
    ex('Tractions lestées',P(T.pull[7]),'RPE 5',150,''),
    ex('Incline DB Press','2 × 8','−20 %',90,''),
    ex('Cable Row','2 × 10','',60,'')]};
  const n=b==='accum'?4:3;
  const items=[
    ex('Incline Dumbbell Press',dl?'2 × 8':b==='accum'?'4 × 8 × 30 kg':b==='max'?'3 × 8':'3 × 6-8',b==='accum'?'RPE 7-8':'RPE 7,5',90,'Tempo 2-0-1.'),
    ex('Tractions prise neutre',dl?'2 × 6':b==='accum'?'4 × 6-8':b==='max'?'3 × 6':'3 × 5-6','+5 à +10 kg — RPE 7',90,'Ce n\'est pas la séance lourde du mercredi.'),
    ex('One-Arm Cable Row',dl?'2 × 10 / côté':b==='accum'?'3 × 10 / côté':'3 × 8 / côté','rotation scapulaire naturelle',70,''),
    ex('Landmine Press debout',dl?'2 × 8 / côté':b==='power'?'2 × 8 / côté':b==='max'?'3 × 6 / côté':'3 × 8 / côté','transfert jambes → tronc → bras',b==='max'?90:75,''),
    ex('Cable Chop haut → bas',dl?'2 × 6 / côté':b==='accum'?'3 × 8 / côté':'3 × 6 / côté','rapide, pivote sur les hanches',60,''),
    ex('Hanging Leg Raise strict',dl?'2 × 8':b==='accum'?'3 × 8-12':'3 × 8','rétroversion du bassin',60,'','Genoux fléchis si trop dur.'),
    ex('Bear Crawl',dl?'2 × 15 m':b==='accum'?'3 × 20 m':b==='max'?'3 × 20 m':'3 × 15 m','genoux à 5 cm du sol',60,''),
  ];
  if(b==='accum') items.push(ex('Conditioning vélo / rameur','8 × (20 s / 70 s)','8/10 sur les 20 s — 12 min',0,'Pas de sprint maximal. Coût musculaire faible.'));
  else if(b==='max') items.push(ex('Conditioning vélo / rameur','6 × (20 s / 100 s)','et pas davantage',0,''));
  else if(b==='power') items.push(ex('Zone 2 vélo (facultatif)','10-15 min','rien de plus',0,''));
  return {title:'Upper Athletic + tronc',dur:dl?'55 min':'80-90 min',charge:'MODÉRÉ',ready:false,warm:'upper',note:'Pas de gros travail excentrique jambes.',items};
}

function tests0(d){
  const S={
    0:{title:'Test initial — jour 1',dur:'90 min',charge:'TEST',ready:false,note:'Note chaque résultat. Ta meilleure distance de broad jump devient la <b>référence</b> du readiness test.',items:[
      ex('Poids','moyenne de 3 matins','à jeun',0,''),
      ex('Broad Jump','3 essais','repos 3 min',180,'Orteils au départ → talon arrière. Garde le meilleur : c\'est ta référence.'),
      ex('Vertical Jump','5 essais','repos 90 s',90,'Marque murale main tendue vs sommet du saut.'),
      ex('Sprint 10 / 20 m','3-4 essais','repos 3-4 min — chrono vidéo',210,'Jamais sur tapis. Si pas d\'espace : saute.'),
      ex('Back Squat 1RM','60×5 / 80×3 / 100×2 / 115×1 / 130×1 / 142,5 / 147,5','repos 4-5 min entre singles',300,'147,5 seulement si 142,5 passe à RPE ≤ 8,5.'),
      ex('Farmer Carry','2 × 40 kg','distance max sans poser',0,'')]},
    1:{title:'Test initial — jour 2',dur:'75 min',charge:'TEST',ready:false,items:[
      ex('Bench 1RM','60×5 / 80×3 / 95×1 / 107,5×1 / 117,5 / 122,5 / 125','repos 4-5 min',300,''),
      ex('Tractions lestées 1RM','+20×3 / +30×1 / +36×1 / +40 / +42,5','repos 4 min',240,'Dead hang, zéro kipping.'),
      ex('Ab Wheel max','1 série strict','',0,'')]},
    2:{title:'Test initial — jour 3',dur:'60 min',charge:'TEST',ready:false,note:'Jamais squat et deadlift le même jour. La semaine 1 commence mercredi.',items:[
      ex('Deadlift 1RM','60×5 / 80×3 / 100×2 / 115×1 / 130×1 / 137,5 / 142,5 / 147,5','selon vitesse — repos 4-5 min',300,''),
      ex('Tractions strictes max','1 série','poitrine à la barre',0,''),
      ex('Hanging Leg Raise max','1 série','',0,'')]},
  };
  return S[d]||{title:'Repos',dur:'',charge:'REPOS',ready:false,items:[],note:'Pas de test ce jour-là.'};
}

const DAYS=['Lun','Mer','Ven','Sam','Dim'];
const DAYS0=['Sam','Dim','Lun','—','—'];
const BUILD=[lundi,mercredi,vendredi,samedi,dimanche];
const WARM={
  lower:'Échauffement 8-10 min : 3 min vélo, ankle rocks ×10/côté, 90/90 hip switch ×8, adductor rockback ×8, glute bridge ×10, squat poids du corps ×10, puis montées de charge.',
  upper:'Échauffement 7-9 min : 3 min rameur, band pull-apart ×15, scap push-up ×10, rotation externe câble ×12, pompes ×8, puis montées de charge.'
};
const CHARGECOLOR={DUR:'var(--max)',RAPIDE:'var(--power)',MODÉRÉ:'var(--accum)',TEST:'var(--taper)',LÉGER:'var(--deload)',REPOS:'var(--deload)'};

/* ---------- STATE ---------- */
let week=1, day=0, baseline=null, done={}, open={};
let tInt=null, tEnd=0;

async function init(){
  const s=await store.get('gm:state'); if(s){week=s.week??1;day=s.day??0;}
  baseline=await store.get('gm:baseline');
  done=(await store.get('gm:done'))||{};
  render();
}
function saveState(){ store.set('gm:state',{week,day}); }

/* ---------- RENDER ---------- */
function render(){
  const b=BLOCK(week);
  document.getElementById('hdr').textContent=week===0?'Tests initiaux avant la semaine 1':`Semaine ${week} — ${BLOCKNAME[b]}`;
  // weeks
  const wk=document.getElementById('weeks'); wk.innerHTML='';
  for(let w=0;w<=12;w++){
    const bb=BLOCK(w); const el=document.createElement('button');
    el.className='wk'+(w===week?' on':''); el.dataset.b=bb;
    el.innerHTML=`<b class="cond">${w===0?'T':w}</b><small>${w===0?'tests':BLOCKNAME[bb].split(' ')[0]}</small>`;
    el.onclick=()=>{week=w;saveState();render();};
    wk.appendChild(el);
  }
  wk.querySelector('.on')?.scrollIntoView({inline:'center',block:'nearest'});
  // days
  const dv=document.getElementById('days'); dv.innerHTML='';
  const labels=week===0?DAYS0:DAYS;
  labels.forEach((l,d)=>{
    if(l==='—') return;
    const el=document.createElement('button');
    const key=`${week}-${d}`; const sess=getSession(week,d);
    const allDone=sess.items.length&&sess.items.every((_,i)=>done[key]?.[i]);
    el.className='day'+(d===day?' on':'')+(allDone?' done':'');
    el.textContent=l; el.onclick=()=>{day=d;saveState();render();};
    dv.appendChild(el);
  });
  renderSession();
  document.getElementById('foot').innerHTML=`Référence broad jump : ${baseline?baseline+' cm':'non définie'} · <button id="setbase">modifier</button> · <button id="reset">réinitialiser la semaine</button>`;
  document.getElementById('setbase').onclick=async()=>{const v=prompt('Meilleur broad jump du test initial (cm) :',baseline||'');if(v&&+v>0){baseline=+v;await store.set('gm:baseline',baseline);render();}};
  document.getElementById('reset').onclick=async()=>{for(let d=0;d<5;d++)delete done[`${week}-${d}`];await store.set('gm:done',done);render();};
}
function getSession(w,d){ return w===0?tests0(d):BUILD[d](w); }

function renderSession(){
  const s=getSession(week,day); const key=`${week}-${day}`;
  const c=document.getElementById('content'); c.innerHTML='';
  const h=document.createElement('div'); h.className='sess';
  h.innerHTML=`<h2 class="cond">${s.title}</h2>
    <div class="meta"><span class="tag" style="background:${CHARGECOLOR[s.charge]}">${s.charge}</span>${s.dur?`<span>Durée <b>${s.dur}</b></span>`:''}<span>${week===0?'Avant semaine 1':'Bloc <b>'+BLOCKNAME[BLOCK(week)]+'</b>'}</span></div>
    ${s.warm?`<p class="note">${WARM[s.warm]}</p>`:''}${s.note?`<p class="note">${s.note}</p>`:''}`;
  c.appendChild(h);
  if(s.ready) c.appendChild(readiness());
  s.items.forEach((e,i)=>{
    const el=document.createElement('div'); el.className='ex'+(done[key]?.[i]?' done':'')+(open[key+i]?' open':'');
    const restTxt=e.rest?fmt(e.rest):'—';
    el.innerHTML=`<div class="top">
      <button class="chk" aria-label="Fait"><i></i></button>
      <div class="body">
        <div class="name">${e.name}</div>
        ${e.load?`<div class="load cond">${e.load}</div>`:''}
        ${e.sub?`<div class="sub">${e.sub}</div>`:''}
        ${(e.cue||e.alt)?`<div class="hint">${open[key+i]?'masquer':'consignes'}</div>`:''}
      </div>
      <button class="rest ${e.rest?'':'none'}" aria-label="Lancer le repos"><b class="cond">${restTxt}</b><small>${e.rest?'repos':'—'}</small></button>
    </div>
    <div class="cue">${e.cue?`<p>${e.cue}</p>`:''}${e.alt?`<p><b>Alternative Basic-Fit :</b> ${e.alt}</p>`:''}</div>`;
    el.querySelector('.chk').onclick=async(ev)=>{ev.stopPropagation();done[key]=done[key]||{};done[key][i]=!done[key][i];await store.set('gm:done',done);render();};
    el.querySelector('.body').onclick=()=>{if(e.cue||e.alt){open[key+i]=!open[key+i];renderSession();}};
    el.querySelector('.rest').onclick=(ev)=>{ev.stopPropagation();if(e.rest)startTimer(e.rest,e.name);};
    c.appendChild(el);
  });
}

function readiness(){
  const box=document.createElement('div'); box.className='ready';
  const stored=mem['gm:ready:'+week+'-'+day];
  let cls='',verdict='';
  if(baseline&&stored){ const p=(stored-baseline)/baseline*100;
    if(p>=-2){cls='g';verdict=`<b style="color:var(--green)">VERT</b> (${p.toFixed(1)} %) — séance complète.`;}
    else if(p>=-5){cls='o';verdict=`<b style="color:var(--orange)">ORANGE</b> (${p.toFixed(1)} %) — −5 % sur les gros mouvements, une série de moins sur les accessoires.`;}
    else{cls='r';verdict=`<b style="color:var(--red)">ROUGE</b> (${p.toFixed(1)} %) — pas de RPE 8+. Lift principal à 60-70 % en 3 × 3, tronc, mobilité, et tu rentres.`;}
  }
  box.className='ready '+cls;
  box.innerHTML=`<h3 class="cond">Readiness — 3 broad jumps</h3>
    <p>${baseline?`Référence ${baseline} cm. Après l'échauffement, 3 sauts, repos 1 min, note le meilleur.`:'Définis d\'abord ta référence (meilleur saut du test initial) en bas de page.'}</p>
    <div class="row"><input type="number" inputmode="decimal" placeholder="meilleur saut du jour, cm" value="${stored||''}"><button>Évaluer</button></div>
    ${verdict?`<div class="verdict">${verdict}</div>`:''}`;
  box.querySelector('button').onclick=()=>{const v=+box.querySelector('input').value;if(v>0){mem['gm:ready:'+week+'-'+day]=v;renderSession();}};
  return box;
}

/* ---------- TIMER ---------- */
function fmt(s){ return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
function startTimer(sec,name){
  clearInterval(tInt); tEnd=Date.now()+sec*1000;
  const t=document.getElementById('timer'); t.className='timer on';
  document.getElementById('tname').textContent='Repos — '+name;
  tick(); tInt=setInterval(tick,250);
}
function tick(){
  const left=Math.max(0,Math.round((tEnd-Date.now())/1000));
  document.getElementById('tval').textContent=fmt(left);
  if(left<=0){clearInterval(tInt);document.getElementById('timer').className='timer on over';document.getElementById('tname').textContent='Repos terminé — série suivante';
    try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}
    beep();}
}
function beep(){ try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator();const g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(a.currentTime+.35);}catch(e){} }
document.getElementById('tstop').onclick=()=>{clearInterval(tInt);document.getElementById('timer').className='timer';};

init();
</script>
</body>
