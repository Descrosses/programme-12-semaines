name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  # Permet de relancer un déploiement à la main depuis l'onglet Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le déploiement échoue si le programme n'est plus conforme au .md :
      # c'est voulu. Mieux vaut pas de mise à jour qu'une charge fausse.
      - name: Tests
        run: npm test

      - name: Vérification des types
        run: npm run typecheck

      - name: Build
        env:
          # GitHub Pages sert le site sous /<nom-du-dépôt>/ : on le déduit du
          # dépôt lui-même, donc renommer le dépôt ne casse rien.
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
